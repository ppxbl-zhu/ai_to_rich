name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install uv==0.11.33
      - run: python -m uv sync --locked --extra dev
      - run: python -m compileall -q src tests migrations
      - run: python -m uv run ruff check .
      - run: python -m uv run ruff format --check .
      - run: python -m uv run pytest -q
      - run: python -m uv run quantagent-health
