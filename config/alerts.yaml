# ============================================================
# QuantAgent 告警规则配置
# 可动态修改，AlertEngine 支持热加载
# ============================================================

alerts:
  # --- 止损止盈 ---
  - name: stop_loss
    condition: "pnl_pct <= -3.0"
    priority: urgent
    message: "触及止损线(-3%), 建议立即卖出"
    cooldown_seconds: 600
    enabled: true

  - name: deep_loss
    condition: "pnl_pct <= -7.0"
    priority: urgent
    message: "深度亏损(-7%), 必须止损!"
    cooldown_seconds: 300
    enabled: true

  - name: take_profit
    condition: "pnl_pct >= 8.0"
    priority: high
    message: "达到止盈目标(+8%), 建议卖出或移动止盈"
    cooldown_seconds: 1800
    enabled: true

  # --- 量能异常 ---
  - name: volume_spike_buy
    condition: "volume_ratio > 3.0 and day_change > 0"
    priority: normal
    message: "放量拉升, 关注突破机会"
    cooldown_seconds: 600
    enabled: true

  - name: volume_spike_sell
    condition: "volume_ratio > 2.5 and day_change < -3"
    priority: high
    message: "放量下跌, 警惕风险!"
    cooldown_seconds: 300
    enabled: true

  # --- 均线 ---
  - name: break_ma20_bearish
    condition: "price < ma20 and pnl_pct < 0"
    priority: normal
    message: "跌破MA20且浮亏, 趋势可能转弱"
    cooldown_seconds: 3600
    enabled: true

  - name: break_ma60
    condition: "price < ma60 and pnl_pct < -3"
    priority: high
    message: "跌破MA60, 中长期趋势转弱"
    cooldown_seconds: 3600
    enabled: true

  # --- 日内异常 ---
  - name: intraday_crash
    condition: "day_change <= -7.0"
    priority: urgent
    message: "日内暴跌! 建议立即评估持仓"
    cooldown_seconds: 300
    enabled: true

  - name: intraday_surge
    condition: "day_change >= 9.0"
    priority: high
    message: "日内大涨接近涨停, 封板可持有否则考虑卖出"
    cooldown_seconds: 600
    enabled: true

  # --- 连续趋势 ---
  - name: consecutive_drop
    condition: "consecutive_down_days >= 3 and pnl_pct < -5"
    priority: high
    message: "连续3日下跌, 需关注是否止损"
    cooldown_seconds: 3600
    enabled: true

  # --- 技术指标 ---
  - name: rsi_overbought
    condition: "rsi14 > 80"
    priority: normal
    message: "RSI超买(>80), 短期可能回调"
    cooldown_seconds: 3600
    enabled: true

  - name: rsi_oversold
    condition: "rsi14 < 20"
    priority: normal
    message: "RSI超卖(<20), 关注反弹机会"
    cooldown_seconds: 3600
    enabled: true

  # --- 风险管理 ---
  - name: position_concentration
    condition: "weight_pct > 40"
    priority: high
    message: "单票仓位超过40%, 集中度风险过高"
    cooldown_seconds: 7200
    enabled: true
