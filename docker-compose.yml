services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: quantagent
      POSTGRES_USER: quantagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantagent -d quantagent"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - quantagent-postgres:/var/lib/postgresql/data

volumes:
  quantagent-postgres:
