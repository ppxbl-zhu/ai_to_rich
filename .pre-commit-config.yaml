repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: python -m pytest -q
        language: python
        additional_dependencies:
          - alembic==1.18.5
          - pytest==9.1.1
          - SQLAlchemy==2.0.51
        pass_filenames: false
