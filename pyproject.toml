[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "quantagent"
version = "0.1.0"
description = "A-share research and paper-trading system"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic==1.18.5",
  "psycopg[binary]==3.3.4",
  "SQLAlchemy==2.0.51",
]

[project.optional-dependencies]
desktop = [
  "pywinauto==0.6.9; sys_platform == 'win32'",
]
dev = [
  "pre-commit==4.6.1",
  "pytest==9.1.1",
  "ruff==0.16.0",
]

[project.scripts]
quantagent-health = "quantagent.health:main"
quantagent-paper = "quantagent.paper_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantagent"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
